<text x="1184" y="784" text-anchor="end" font-size="12.5" font-weight="800" fill="#7c2d12">أربع آليات تحرس الجدول:</text>
<text x="1184" y="806" text-anchor="end" font-size="12" fill="#334155">1) قاعدة الخمسة: K_ORG = 5 (lib/org-impact/registry.ts) و K_WEAVE = 5 (lib/map/weave.ts) — تحت الحدّ تظهر جملة خصوصية لا رقم.</text>
<text x="1184" y="828" text-anchor="end" font-size="12" fill="#334155">2) الموافقة عمودٌ على صفّ المتعلّم نفسه (share_trainer) — تُسحب فورًا، ولا تُخزَّن نُسخ من الاقتباسات المأذونة.</text>
<text x="1184" y="850" text-anchor="end" font-size="12" fill="#334155">3) اختبارات على JSON الخام: لا بريد ولا اسم ولا مسار صوت (map-voice / note_voice) في أي حمولة تخرج من شاشة صاحبها — tests/p57 · p58 · p59 · p60 · p61 · p62.</text>
<text x="1184" y="872" text-anchor="end" font-size="12" fill="#334155">4) الحجب على الخادم: نصّ «رسالة إلى نفسي» وصوتها لا يخرجان قبل opened_at (toPublicLetter) — الكرون يُنبّه ولا يفتح (isLegacyCapsule يعزل الكبسولات القديمة).</text>
