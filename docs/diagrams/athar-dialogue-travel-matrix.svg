<text x="1210" y="40" text-anchor="end" font-size="22" font-weight="900" fill="#0f2a4e">أَثَر — حلقة الحوار (P51–P62): ما يسافر وما لا يسافر</text>
<text x="1210" y="64" text-anchor="end" font-size="12" fill="#64748b">أخضر = يصل كاملًا لصاحبه/مستلمه · أزرق = مجمَّع أو بإذن (قاعدة الخمسة) · أحمر = لا يسافر · لا شيء هنا يدخل في أي تقييم · © 2026 د. أحمد محمد عبدالعزيز بدوي</text>
<text x="1210" y="86" text-anchor="end" font-size="12" font-weight="800" fill="#7c2d12">القاعدة الذهبية: الإنسان يقول، والإنسان يردّ، والنظام يُعيد لا يحكم. الصوت هُويّة لا يسافر — ورسالتك إلى نفسك لا يقرؤها أحد قبل موعدها، ولا أنت.</text>
